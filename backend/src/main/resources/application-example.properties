spring.application.name=jobready
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:import.sql
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.error.include-stacktrace=never
logging.level.root=INFO
logging.level.com.jobready.web=DEBUG
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.api-docs.path=/v3/api-docs
server.port=${PORT:8080}
ip.frontend=${FRONTEND_URL:http://localhost:3000}
jwt.secret=${JWT_SECRET}
jwt.expiration=1200000
# Subida de videos de entrevista (hasta 100 MB) y PDF de evaluacion
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Correo (recuperacion de contrasena). Con Gmail: MAIL_USERNAME = la cuenta y MAIL_PASSWORD = una
# contrasena de aplicacion (no la contrasena normal). Sin MAIL_USERNAME el enlace solo se escribe en el log.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
jobready.mail.from=${MAIL_FROM:}
